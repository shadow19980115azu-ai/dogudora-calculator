<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ドグドラ周回 収益計算機</title><style>
:root{--bg:#080c17;--card:#121a2c;--line:#26334f;--text:#f5f7ff;--muted:#9aa8c5;--blue:#4c8dff;--green:#38c879;--red:#ff5a67;--gold:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#080c17,#0d1424);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 18px)}main{max-width:520px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px}.top h1{font-size:19px;margin:0}.settingsBtn{border:1px solid var(--line);background:#151e32;color:white;border-radius:12px;padding:10px 13px;font-size:15px}.hero,.card{background:rgba(18,26,44,.96);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 35px #0004}.hero{padding:16px;margin-bottom:12px}.progressHead{display:flex;justify-content:space-between;align-items:end}.remaining{font-size:14px;color:var(--muted)}#left{font-size:36px;font-weight:850;letter-spacing:-1px;color:white}.battle{font-weight:700}.bar{height:8px;background:#26314a;border-radius:20px;overflow:hidden;margin-top:11px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4c8dff,#64d8ff);width:0;transition:.2s}.tapgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.drop{border:0;color:#fff;border-radius:20px;min-height:112px;padding:12px;font-weight:800;box-shadow:inset 0 0 0 1px #ffffff1c,0 6px 15px #0003;touch-action:manipulation}.drop:active{transform:scale(.97)}.drop .icon{font-size:26px}.drop .name{font-size:17px;margin:5px 0}.drop .count{font-size:25px}.core{background:linear-gradient(145deg,#8d2636,#d84a5c)}.p75{background:linear-gradient(145deg,#18559e,#2f8ce5)}.p45{background:linear-gradient(145deg,#187144,#2caf6b)}.lose{background:linear-gradient(145deg,#3b4252,#606b7e)}.actions{display:grid;grid-template-columns:2fr 1fr;gap:9px}.actions button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:#172137;color:#fff;font-size:15px;font-weight:700}.actions .reset{color:#ff9ca5}.card{padding:16px;margin-top:12px}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em}.profit{font-size:32px;font-weight:900;margin:5px 0 12px;letter-spacing:-1px}.profit.pos{color:#61e59a}.profit.neg{color:#ff7c86}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.row b{color:var(--text)}details.card{padding:0;overflow:hidden}summary{list-style:none;padding:16px;font-weight:800;cursor:pointer}summary::-webkit-details-marker{display:none}.settings{padding:0 16px 16px;display:grid;gap:13px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;font-size:16px;color:#fff;background:#0c1322;border:1px solid var(--line);border-radius:12px;padding:12px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#0c1322;border-radius:12px;padding:3px;border:1px solid var(--line)}.seg label{padding:9px 5px;text-align:center;border-radius:9px;font-size:13px}.seg input{display:none}.seg label:has(input:checked){background:#2a3c60;color:white}.expected{font-size:14px}.status{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;min-height:18px}.foot{text-align:center;color:#697895;font-size:11px;padding:14px 6px 0}@media(min-width:700px){body{padding-top:30px}.drop{min-height:125px}}
</style></head><body><main><header class="top"><h1>🐉 ドグドラ周回</h1><button class="settingsBtn" onclick="document.querySelector('details').open=true;document.querySelector('details').scrollIntoView({behavior:'smooth'})">⚙️ 設定</button></header>
<section class="hero"><div class="progressHead"><div><div class="remaining">残り</div><div><span id="left">20</span> <span class="battle">戦</span></div></div><div id="progressText" class="remaining">0 / 20 戦</div></div><div class="bar"><i id="bar"></i></div><div id="status" class="status">討伐後に結果をタップ</div></section>
<section class="tapgrid"><button class="drop core" onclick="add('Core')"><div class="icon">💎</div><div class="name">輝晶核</div><div class="count">× <span id="Core">0</span></div></button><button class="drop p75" onclick="add('75')"><div class="icon">🔵</div><div class="name">破片 75</div><div class="count">× <span id="75">0</span></div></button><button class="drop p45" onclick="add('45')"><div class="icon">🟢</div><div class="name">破片 45</div><div class="count">× <span id="45">0</span></div></button><button class="drop lose" onclick="add('Lose')"><div class="icon">💥</div><div class="name">敗北</div><div class="count">× <span id="Lose">0</span></div></button></section>
<div class="actions"><button onclick="undo()">↩︎ 直前の入力を戻す</button><button class="reset" onclick="resetAll()">リセット</button></div>
<section class="card"><div class="eyebrow">今回の純損益</div><div id="profit" class="profit">−15,750,000 G</div><div class="rows"><div class="row"><span>獲得破片</span><b id="frags">0 個</b></div><div class="row"><span>売上</span><b id="revenue">0 G</b></div><div class="row"><span>細胞代（全設定戦）</span><b id="cost">15,750,000 G</b></div><div class="row"><span>平均との差</span><b id="diff">—</b></div></div></section>
<details class="card"><summary>⚙️ 条件設定・期待値</summary><div class="settings"><div class="field"><label>輝晶核の相場（万G）</label><input id="corePrice" type="number" inputmode="decimal" value="137" step="0.1"></div><div class="field"><label>魔因細胞の単価（万G）</label><input id="cellPrice" type="number" inputmode="decimal" value="10.5" step="0.1"></div><div class="field"><label>持ち寄り回数（1回 = 4戦）</label><input id="runs" type="number" inputmode="numeric" value="5" min="1" step="1"></div><div class="field"><label>素材の売り方</label><div class="seg"><label><input type="radio" name="sell" value="1" checked>バザー −5%</label><label><input type="radio" name="sell" value="2">直接取引</label></div></div><div class="rows expected"><div class="row"><span>期待破片</span><b id="expFrags">—</b></div><div class="row"><span>期待売上</span><b id="expRev">—</b></div><div class="row"><span>期待純利益</span><b id="expProfit">—</b></div></div></div></details><div class="foot">4人持ち寄り・実質魔因細胞7.5個/戦で計算</div></main>
<script>
const KEY='dogudora-mobile-v1';let state={Core:0,'75':0,'45':0,Lose:0},history=[];const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('ja-JP')+' G';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state=x.state||state;history=x.history||[];$('corePrice').value=x.corePrice??137;$('cellPrice').value=x.cellPrice??10.5;$('runs').value=x.runs??5;document.querySelector(`input[name=sell][value="${x.sell||1}"]`).checked=true}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify({state,history,corePrice:$('corePrice').value,cellPrice:$('cellPrice').value,runs:$('runs').value,sell:document.querySelector('input[name=sell]:checked').value}))}
function add(t){state[t]++;history.push(t);navigator.vibrate?.(15);render()}function undo(){const t=history.pop();if(t&&state[t]>0)state[t]--;render()}function resetAll(){if(confirm('戦績カウントをすべて0にしますか？')){state={Core:0,'75':0,'45':0,Lose:0};history=[];render()}}
function render(){['Core','75','45','Lose'].forEach(k=>$(k).textContent=state[k]);const cp=(parseFloat($('corePrice').value)||0)*10000,cell=(parseFloat($('cellPrice').value)||0)*10000,runs=parseInt($('runs').value)||0,total=runs*4,sell=document.querySelector('input[name=sell]:checked').value,done=Object.values(state).reduce((a,b)=>a+b,0),left=total-done,val=cp/99,cost=total*7.5*cell,fr=state.Core*99+state['75']*75+state['45']*45,rev=fr*val*(sell==='1'?.95:1),profit=rev-cost,expected=63.9*total,expRev=expected*val*(sell==='1'?.95:1),expProfit=expRev-cost,diff=done?fr-63.9*done:0;$('left').textContent=Math.max(0,left);$('progressText').textContent=`${done} / ${total} 戦`;$('bar').style.width=Math.min(100,total?done/total*100:0)+'%';$('status').textContent=done===0?'討伐後に結果をタップ':left>0?`あと ${left} 戦`:left===0?'✓ 全戦績の入力完了':`⚠ ${-left} 戦分多く入力されています`;$('frags').textContent=fr.toLocaleString()+' 個';$('revenue').textContent=fmt(rev);$('cost').textContent=fmt(cost);$('profit').textContent=(profit>=0?'+':'')+fmt(profit);$('profit').className='profit '+(profit>=0?'pos':'neg');$('diff').textContent=done?(diff>=0?'+':'')+diff.toFixed(1)+' 個':'—';$('expFrags').textContent=expected.toFixed(1)+' 個';$('expRev').textContent=fmt(expRev);$('expProfit').textContent=(expProfit>=0?'+':'')+fmt(expProfit);save()}
load();document.querySelectorAll('input').forEach(e=>e.addEventListener('input',render));document.querySelectorAll('input[name=sell]').forEach(e=>e.addEventListener('change',render));render();
</script></body></html>
